Local Kind Kubernetes Cluster Automation

This project provides a fully automated approach to deploying a Kubernetes cluster locally using Kind (Kubernetes IN Docker), enabling developers and DevOps engineers to gain practical, hands-on experience with Kubernetes without requiring cloud infrastructure.

The solution automates the complete environment setup, including WSL 2, Docker Desktop, kubectl, Kind, and Kubernetes cluster creation. It supports dynamic cluster configuration, allowing users to define the cluster name and worker node count while automatically generating the required Kind configuration.

The project is designed to simplify Kubernetes learning and DevOps experimentation by providing a repeatable, consistent, and automation-driven local Kubernetes environment.

Key areas covered:

☸️ Local Kubernetes cluster deployment using Kind
🐳 Docker Desktop container runtime
🪟 WSL 2 integration
⚙️ Automated installation of kubectl & Kind CLI
🔄 Dynamic Kubernetes cluster configuration
🏗️ Infrastructure configuration using YAML
🤖 PowerShell-based automation
🔍 Automated cluster and node validation
🧪 Hands-on Kubernetes labs and experimentation
🚀 Foundation for learning DevOps, CI/CD, Docker, Kubernetes & Infrastructure as Code

Objective:

Build a simple, automated, and repeatable local Kubernetes platform for hands-on learning, DevOps experimentation, application deployment, and Kubernetes administration.